# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng. Luôn nêu response_type."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời mong đợi. yes_no khi hỏi người dùng đồng ý hay không, kể cả xác nhận trước khi ghi dữ liệu; đừng diễn đạt câu hỏi đồng ý/không thành hai lựa chọn. choice khi câu trả lời phải là một giá trị trong tập hợp đóng đã biết, liệt kê đúng các giá trị đó ở options. text khi người dùng phải tự cung cấp thông tin như mã tài sản hoặc mã nhân viên."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn, chỉ dùng với response_type choice. Mỗi phần tử là một giá trị hợp lệ của tham số đang thiếu, viết đúng như tham số đó nhận, không thêm chữ mô tả."}
      required: [question, response_type]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái một dịch vụ."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường, chỉ điền khi người dùng nói rõ production hay staging. Tên môi trường khác hoặc cách gọi nội bộ không suy ra được giá trị nào ở đây; khi đó hỏi lại người dùng thay vì chọn giúp."}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin và chẩn đoán thiết bị."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu người dùng trong danh bạ hỗ trợ."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]

  # ---------------- Team-built bonus tools ----------------
  - name: check_software_license
    description: "Kiểm tra quyền sử dụng và trạng thái license phần mềm của một nhân viên. Tool chỉ đọc dữ liệu giả lập; không cấp, thu hồi hoặc mua license. Cần hỏi lại nếu thiếu employee_id hoặc tên phần mềm."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên giả lập, ví dụ EMP-1001"}
        software: {type: string, description: "Tên phần mềm hoặc alias, ví dụ Microsoft 365, Office, Adobe, Figma hoặc Zoom"}
      required: [employee_id, software]

  - name: unlock_user_account
    description: "Mở khóa tài khoản SSO giả lập đang ở trạng thái locked. Đây là action ghi dữ liệu: phải nêu lại employee_id và system rồi nhận xác nhận rõ ràng ở lượt hiện tại trước khi gọi với confirmed=true. Không dùng cho tài khoản disabled, active hoặc password_expired; không yêu cầu hay truyền mật khẩu, OTP, token hoặc recovery code."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên giả lập cần mở khóa, ví dụ EMP-1003"}
        system: {type: string, enum: [sso], default: "sso", description: "Hệ thống tài khoản được hỗ trợ"}
        confirmed: {type: boolean, default: false, description: "Chỉ true sau khi người dùng xác nhận rõ employee_id và system ở lượt hiện tại"}
      required: [employee_id, system, confirmed]
